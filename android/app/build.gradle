apply plugin: 'com.android.application'
apply plugin: 'com.google.android.gms.oss-licenses-plugin'

def releaseVersionCodeEnv = System.getenv('SECPAL_ANDROID_VERSION_CODE')
def releaseVersionCodeString = (releaseVersionCodeEnv && releaseVersionCodeEnv.trim()) ? releaseVersionCodeEnv.trim() : '1'
def releaseVersionCode
try {
    releaseVersionCode = Integer.parseInt(releaseVersionCodeString)
} catch (NumberFormatException e) {
    throw new GradleException("Invalid SECPAL_ANDROID_VERSION_CODE environment variable value '${releaseVersionCodeEnv}'. Expected a numeric integer version code.")
}
if (releaseVersionCode <= 0 || releaseVersionCode > 2100000000) {
    throw new GradleException("Invalid SECPAL_ANDROID_VERSION_CODE environment variable value '${releaseVersionCodeEnv}'. Expected an integer from 1 through 2100000000.")
}
def canonicalVersionFile = new File(rootProject.projectDir.parentFile, 'VERSION')
if (!canonicalVersionFile.isFile()) {
    throw new GradleException("Missing canonical Android version file: ${canonicalVersionFile}")
}
def releaseVersionName = canonicalVersionFile.getText('UTF-8').trim()
if (!(releaseVersionName ==~ /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/)) {
    throw new GradleException("Invalid canonical Android version '${releaseVersionName}' in ${canonicalVersionFile}. Expected semantic version syntax.")
}
def releaseKeystorePath = System.getenv('SECPAL_ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('SECPAL_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('SECPAL_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SECPAL_ANDROID_KEY_PASSWORD')
def samsungAppKeyPttData = (System.getenv('SECPAL_ANDROID_SAMSUNG_APP_KEY_PTT_DATA') ?: '').trim()
def samsungAppKeySosData = (System.getenv('SECPAL_ANDROID_SAMSUNG_APP_KEY_SOS_DATA') ?: '').trim()
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword
def androidRepositoryRoot = rootProject.projectDir.parentFile
def runtimeSchemaVerifier = new File(androidRepositoryRoot, 'scripts/verify-android-runtime-schema.mjs')
def runtimeAssetInventory = new File(androidRepositoryRoot, 'scripts/android-web-asset-inventory.mjs')
def runtimeAssetInventoryGenerator = new File(androidRepositoryRoot, 'scripts/generate-android-web-asset-inventory.mjs')
def runtimeArchiveReader = new File(androidRepositoryRoot, 'scripts/literal-zip-archive.mjs')
def generatedAndroidWebAssets = new File(projectDir, 'src/main/assets/public')
def debugAndroidWebAssets = new File(projectDir, 'src/debug/assets/public')
def debugAndroidWebAssetInventory = new File(debugAndroidWebAssets, 'secpal-web-assets.json')
def fallbackAndroidWebAssetInventory = new File(projectDir, 'src/main/web-assets-fallback.json')
def androidAssetIgnorePolicyFile = new File(projectDir, 'aapt-ignore-assets.json')
def androidAssetIgnorePolicy
try {
    androidAssetIgnorePolicy = new groovy.json.JsonSlurper().parse(androidAssetIgnorePolicyFile)
} catch (Exception e) {
    throw new GradleException("Invalid Android asset ignore policy: ${androidAssetIgnorePolicyFile}", e)
}
def androidAssetIgnorePattern = androidAssetIgnorePolicy.ignore_assets_pattern
if (!(androidAssetIgnorePattern instanceof String) || !androidAssetIgnorePattern.trim()) {
    throw new GradleException("Android asset ignore policy must define a non-empty ignore_assets_pattern: ${androidAssetIgnorePolicyFile}")
}
def androidStringsXml = new File(projectDir, 'src/main/res/values/strings.xml')
def configuredFrontendRepositoryPath = (System.getenv('SECPAL_ANDROID_FRONTEND_DIR') ?: '').trim()
def configuredFrontendRepositoryFile = configuredFrontendRepositoryPath
    ? new File(configuredFrontendRepositoryPath)
    : null
def configuredFrontendRepositoryRoot = configuredFrontendRepositoryFile == null
    ? null
    : (configuredFrontendRepositoryFile.isAbsolute()
        ? configuredFrontendRepositoryFile.canonicalFile
        : new File(androidRepositoryRoot, configuredFrontendRepositoryPath).canonicalFile)
def frontendRepositoryRoot = configuredFrontendRepositoryRoot
    ?: new File(androidRepositoryRoot.parentFile, 'frontend').canonicalFile
// graphics-path is a pre-stripped transitive dependency of the OSS licenses v2 runtime.
// Keep its shipped binaries intact instead of asking AGP to strip absent debug symbols.
def preStrippedAndroidxGraphicsPath = '**/libandroidx.graphics.path.so'

android {
    namespace "app.secpal"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    testBuildType "ctRegression"
    testOptions {
        unitTests.includeAndroidResources = true
    }
    defaultConfig {
        applicationId "app.secpal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        manifestPlaceholders = [
            secpalSamsungAppKeyPttData: samsungAppKeyPttData,
            secpalSamsungAppKeySosData: samsungAppKeySosData,
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern androidAssetIgnorePattern
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField "boolean", "ALLOW_SCREENSHOTS", "false"
        }
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField "boolean", "ALLOW_SCREENSHOTS", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        ctRegression {
            initWith release
            applicationIdSuffix ".ctregression"
            matchingFallbacks = ['release']
            proguardFile 'ct-regression-proguard-rules.pro'
            testProguardFile 'ct-regression-proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        storeListing {
            initWith debug
            debuggable true
            minifyEnabled false
            shrinkResources false
            applicationIdSuffix ".storelisting"
            matchingFallbacks = ['debug']
            buildConfigField "boolean", "ALLOW_SCREENSHOTS", "true"
        }
    }
    sourceSets {
        ctRegression {
            manifest.srcFile "src/ctRegression/AndroidManifest.xml"
            java.srcDirs = ["src/debug/java"]
            res.srcDirs = ["src/debug/res"]
            assets.srcDirs = ["src/debug/assets"]
        }
    }
    packaging {
        jniLibs {
            keepDebugSymbols += ['**/libdatastore_shared_counter.so']
            keepDebugSymbols += [preStrippedAndroidxGraphicsPath]
        }
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    if ((findProperty('secpalJavaDeprecationLint') ?: 'false').toBoolean()) {
        options.compilerArgs += ['-Xlint:deprecation']
    }
}

tasks.register("generateReleaseNetworkSecurityVerificationInputs") {
    group = "verification"
    description = "Generates only the merged release resources needed for network-security verification."
    dependsOn(
        "processReleaseResources",
        "processReleaseManifestForPackage"
    )
}

tasks.register("prepareAndroidRuntimeSchemaAsset", Exec) {
    group = "verification"
    description = "Rebuilds and copies the complete frontend when frontend source is present."
    onlyIf("frontend source is present") {
        frontendRepositoryRoot.isDirectory()
    }
    workingDir androidRepositoryRoot
    commandLine("npm", "run", "cap:copy")
}

def androidPackagingTaskPaths = [] as Set
def isAndroidPackagingScheduled = {
    androidPackagingTaskPaths.any { taskPath ->
        gradle.taskGraph.hasTask(taskPath)
    }
}
def frontendPackagingGuard = tasks.register("requireFrontendSourceForAndroidPackaging") {
    group = "verification"
    description = "Fails distributable packaging when the complete frontend cannot be regenerated."
    onlyIf("packaging is scheduled without frontend source") {
        isAndroidPackagingScheduled() && !frontendRepositoryRoot.isDirectory()
    }
    doLast {
        throw new GradleException(
            "Android packaging requires the SecPal frontend source at ${frontendRepositoryRoot}. " +
                "Set SECPAL_ANDROID_FRONTEND_DIR to a valid frontend checkout."
        )
    }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    // ctRegression packages only native CI instrumentation and is never published.
    if (variant.name != "ctRegression") {
        def variantTaskSuffix = variant.name.capitalize()
        def packagingTaskNames = ["assemble", "bundle", "install", "package"].collect {
            "${it}${variantTaskSuffix}"
        } + [
            "package${variantTaskSuffix}Bundle",
            "package${variantTaskSuffix}UniversalApk",
            "sign${variantTaskSuffix}Bundle",
        ]
        packagingTaskNames.each { packagingTaskName ->
            androidPackagingTaskPaths.add("${project.path}:${packagingTaskName}")
            tasks.matching { it.name == packagingTaskName }.configureEach {
                dependsOn(frontendPackagingGuard)
            }
        }
    }
}

tasks.register("verifyAndroidRuntimeSchemaAsset", Exec) {
    group = "verification"
    description = "Fails when generated Android web assets drift from their inventory or canonical schema-4 bridge."
    dependsOn("prepareAndroidRuntimeSchemaAsset")
    inputs.files(
        runtimeSchemaVerifier,
        runtimeAssetInventory,
        runtimeArchiveReader,
        fallbackAndroidWebAssetInventory,
        androidAssetIgnorePolicyFile,
        androidStringsXml
    )
    inputs.dir(generatedAndroidWebAssets)
    onlyIf("generated Android web asset directory is present") {
        generatedAndroidWebAssets.isDirectory()
    }
    commandLine(
        "node",
        runtimeSchemaVerifier.absolutePath,
        generatedAndroidWebAssets.absolutePath,
        androidStringsXml.absolutePath,
        fallbackAndroidWebAssetInventory.absolutePath
    )
}

def debugAndroidWebAssetInventoryTask = tasks.register("generateDebugAndroidWebAssetInventory", Exec) {
    group = "build"
    description = "Generates an exact inventory for merged debug and CT regression WebView assets."
    dependsOn("verifyAndroidRuntimeSchemaAsset")
    inputs.dir(generatedAndroidWebAssets)
    inputs.files(fileTree(debugAndroidWebAssets) {
        exclude "secpal-web-assets.json"
    })
    inputs.file(runtimeAssetInventoryGenerator)
    inputs.file(runtimeAssetInventory)
    outputs.file(debugAndroidWebAssetInventory)
    workingDir androidRepositoryRoot
    commandLine(
        "node",
        runtimeAssetInventoryGenerator.absolutePath,
        generatedAndroidWebAssets.absolutePath,
        "--overlay", debugAndroidWebAssets.absolutePath,
        "--output", debugAndroidWebAssetInventory.absolutePath
    )
}

tasks.matching {
    def normalizedTaskName = it.name.toLowerCase(java.util.Locale.ROOT)
    it.name != "generateDebugAndroidWebAssetInventory" &&
        (normalizedTaskName.contains("debug") || normalizedTaskName.contains("ctregression")) &&
        (normalizedTaskName.contains("asset") || normalizedTaskName.contains("lint"))
}.configureEach {
    dependsOn(debugAndroidWebAssetInventoryTask)
}

tasks.register("verifyReleasePasskeyDependencies") {
    group = "verification"
    description = "Fails when the vulnerable Google Play services FIDO dependency reaches the release classpath."

    doLast {
        def forbiddenComponents = configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents.findAll {
            it.moduleVersion.group == "com.google.android.gms" && it.moduleVersion.name == "play-services-fido"
        }

        if (!forbiddenComponents.isEmpty()) {
            throw new GradleException(
                "Release runtime classpath contains forbidden play-services-fido components: " +
                    forbiddenComponents.collect { it.moduleVersion }.join(", ")
            )
        }
    }
}

tasks.register("verifyCtRegressionSecurityDependencies") {
    group = "verification"
    description = "Fails when release-forbidden FIDO or Tink code reaches the CT regression runtime."

    doLast {
        def forbiddenComponents = configurations.ctRegressionRuntimeClasspath.incoming.resolutionResult.allComponents.findAll {
            it.moduleVersion != null && (
                (it.moduleVersion.group == "com.google.android.gms" && it.moduleVersion.name == "play-services-fido")
                || it.moduleVersion.group == "com.google.crypto.tink"
            )
        }

        if (!forbiddenComponents.isEmpty()) {
            throw new GradleException(
                "CT regression runtime classpath contains release-forbidden security components: " +
                    forbiddenComponents.collect { it.moduleVersion }.join(", ")
            )
        }
    }
}

tasks.matching { it.name in ["preReleaseBuild", "preCtRegressionBuild"] }.configureEach {
    dependsOn(rootProject.tasks.named("verifyBuildToolTinkVersion"))
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn(frontendPackagingGuard)
    dependsOn("verifyAndroidRuntimeSchemaAsset")
}

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn("verifyReleasePasskeyDependencies")
}

tasks.matching { it.name == "preCtRegressionBuild" }.configureEach {
    dependsOn("verifyCtRegressionSecurityDependencies")
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-common'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-oss-licenses:17.5.1'
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.credentials:credentials:$androidxCredentialsVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
