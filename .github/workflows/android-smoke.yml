---
name: Android Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-smoke.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/android-web-asset-inventory.mjs"
      - "scripts/android-smoke.mjs"
      - "scripts/build-frontend-web.sh"
      - "scripts/check-android-app-health.sh"
      - "scripts/forward-android-webview.sh"
      - "scripts/generate-android-web-asset-inventory.mjs"
      - "scripts/inject-native-auth-bridge.mjs"
      - "scripts/verify-android-frontend-build.mjs"
      - "scripts/verify-android-runtime-schema.mjs"
      - "scripts/verify-android-web-assets-clean.mjs"
      - "scripts/verify-android-web-asset-overlays.mjs"
      - "scripts/normalize-capacitor-cordova-gradle.mjs"
      - "scripts/normalize-cordova-config.mjs"
      - "scripts/patch-capacitor-android-unchecked.mjs"
      - "scripts/start-android-emulator.sh"
      - "scripts/wait-for-android-device.sh"
      - "scripts/webview-cdp-client.mjs"
      - "scripts/webview-live-auth-smoke.mjs"
      - "scripts/with-android-env.sh"
      - "tests/android-smoke*.test.ts"
      - "tests/android-native-auth-route-inventory.test.ts"
      - "tests/native-auth-bridge*.test.ts"
      - "tests/webview-*.test.ts"
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify applicable native checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.result }}
    steps:
      - name: Read complete native PR diff
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEVANT_PATHS: >-
            [".github/workflows/android-smoke.yml","android/**","capacitor.config.ts","package.json","package-lock.json","scripts/android-web-asset-inventory.mjs","scripts/android-smoke.mjs","scripts/build-frontend-web.sh","scripts/check-android-app-health.sh","scripts/forward-android-webview.sh","scripts/generate-android-web-asset-inventory.mjs","scripts/inject-native-auth-bridge.mjs","scripts/verify-android-frontend-build.mjs","scripts/verify-android-runtime-schema.mjs","scripts/verify-android-web-assets-clean.mjs","scripts/verify-android-web-asset-overlays.mjs","scripts/normalize-capacitor-cordova-gradle.mjs","scripts/normalize-cordova-config.mjs","scripts/patch-capacitor-android-unchecked.mjs","scripts/start-android-emulator.sh","scripts/wait-for-android-device.sh","scripts/webview-cdp-client.mjs","scripts/webview-live-auth-smoke.mjs","scripts/with-android-env.sh","tests/android-smoke*.test.ts","tests/android-native-auth-route-inventory.test.ts","tests/native-auth-bridge*.test.ts","tests/webview-*.test.ts"]
        with:
          result-encoding: string
          script: |
            if (context.eventName !== 'pull_request') return 'true';
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const read = async () => (await github.rest.pulls.get({ owner, repo, pull_number })).data;
            const before = await read();
            if (before.head.sha !== context.payload.pull_request.head.sha) throw new Error('PR head changed');
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            if (!files.length || files.length >= 3000 || files.length !== before.changed_files ||
                !files.every(file => typeof file.filename === 'string' &&
                  (file.previous_filename === undefined || typeof file.previous_filename === 'string'))) {
              throw new Error('Incomplete native PR diff');
            }
            const after = await read();
            if (after.head.sha !== before.head.sha || after.base.sha !== before.base.sha) throw new Error('PR changed');
            const { matchesGlob } = require('node:path');
            const patterns = JSON.parse(process.env.RELEVANT_PATHS);
            const relevant = path => patterns.some(pattern => pattern.endsWith('/**')
              ? path === pattern.slice(0, -3) || path.startsWith(pattern.slice(0, -2))
              : matchesGlob(path, pattern));
            return files.some(file => relevant(file.filename) ||
              (file.previous_filename && relevant(file.previous_filename))) ? 'true' : 'false';

  smoke:
    needs: scope
    if: ${{ needs.scope.outputs.relevant == 'true' }}
    name: Android user journey (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5570
      SECPAL_ANDROID_FRONTEND_DIR: ${{ github.workspace }}/frontend
      SECPAL_RUNTIME_URL: https://api.secpal.dev
      SECPAL_TEST_EMAIL: android-ci@example.com
      SECPAL_WEBVIEW_CDP_REQUEST_TIMEOUT_MS: "5000"
      SECPAL_WEBVIEW_DEVTOOLS_URL: http://127.0.0.1:9223/json/list
      SECPAL_WEBVIEW_TARGET_PATTERN: app\.secpal\.dev
      SMOKE_STEP_FILE: ${{ github.workspace }}/android-smoke-step.txt

    steps:
      - name: Checkout Android repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate dedicated test credential
        env:
          SECPAL_TEST_PASSWORD: ${{ secrets.ANDROID_SMOKE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SECPAL_TEST_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_SMOKE_PASSWORD in both Actions and Dependabot secrets."
            exit 1
          fi

      - name: Check development API readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "api-readiness" > "$SMOKE_STEP_FILE"
          ready_body="${RUNNER_TEMP}/secpal-api-ready.json"
          ready=false
          readiness_deadline=$((SECONDS + 120))
          attempt=0
          while (( SECONDS < readiness_deadline )); do
            attempt=$((attempt + 1))
            status="$(curl --silent --show-error --connect-timeout 2 --max-time 4 \
              --output "$ready_body" --write-out '%{http_code}' \
              https://api.secpal.dev/health/ready || true)"
            if [[ "$status" == "200" ]] && jq -e '.status == "ready"' "$ready_body" >/dev/null; then
              ready=true
              echo "Development API is ready (attempt ${attempt})."
              break
            fi
            remaining=$((readiness_deadline - SECONDS))
            if (( remaining > 0 )); then
              sleep_seconds=$((remaining < 5 ? remaining : 5))
              sleep "$sleep_seconds"
            fi
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::Development API is not ready; the Android emulator will not be started."
            live_body="${RUNNER_TEMP}/secpal-api-live.json"
            live_status="$(curl --silent --show-error --connect-timeout 3 --max-time 5 \
              --output "$live_body" --write-out '%{http_code}' \
              https://api.secpal.dev/health/live || true)"
            echo "Diagnostic liveness status: ${live_status:-unavailable}"
            jq -c . "$live_body" 2>/dev/null || echo "Diagnostic liveness body unavailable."
            exit 1
          fi

      - name: Read pinned frontend revision
        id: frontend-revision
        shell: bash
        run: |
          set -euo pipefail
          frontend_revision_file="android/frontend-revision.txt"
          frontend_sha="$(awk '/^[0-9a-f]{40}$/ { print }' "$frontend_revision_file")"
          if [[ ! "$frontend_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::${frontend_revision_file} must contain exactly one full lowercase commit SHA."
            exit 1
          fi
          echo "sha=${frontend_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SecPal/frontend
          ref: ${{ steps.frontend-revision.outputs.sha }}
          path: frontend

      - name: Record tested revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          android_sha="$(git rev-parse HEAD)"
          frontend_sha="$(git -C frontend rev-parse HEAD)"
          android_build_date="$(date --utc +%Y%m%d)"
          smoke_version_code="${android_build_date}99"
          if [[ ! "$smoke_version_code" =~ ^[0-9]{10}$ ]] || \
            (( 10#${smoke_version_code} > 2100000000 )); then
            echo "::error::Android smoke version code is invalid: ${smoke_version_code}"
            exit 1
          fi
          echo "android-sha=${android_sha}" >> "$GITHUB_OUTPUT"
          echo "frontend-sha=${frontend_sha}" >> "$GITHUB_OUTPUT"
          echo "SECPAL_ANDROID_VERSION_CODE=${smoke_version_code}" >> "$GITHUB_ENV"
          echo "Android SHA: ${android_sha}"
          echo "Frontend SHA: ${frontend_sha}"
          echo "Android version code: ${smoke_version_code}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.11.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install reproducible dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "install-dependencies" > "$SMOKE_STEP_FILE"
          npm ci
          npm --prefix frontend ci

      - name: Build debug APK from pinned frontend
        shell: bash
        run: |
          set -euo pipefail
          echo "build-debug-apk" > "$SMOKE_STEP_FILE"
          npm run cap:sync
          npm run native:verify:web-assets-clean
          npm run native:assemble:debug
          npm run native:verify:web-assets-clean
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify generated native-auth route parity
        env:
          SECPAL_REQUIRE_PACKAGED_ROUTE_PARITY: "1"
        run: ./node_modules/.bin/vitest run tests/android-native-auth-route-inventory.test.ts

      - name: Start API-35 emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/secpal-smoke-avd
          SECPAL_ANDROID_EMULATOR_GPU_MODE: software
          SECPAL_ANDROID_EMULATOR_WINDOW_MODE: no-window
        shell: bash
        run: |
          set -euo pipefail
          echo "start-emulator" > "$SMOKE_STEP_FILE"
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          image="system-images;android-35;google_apis;x86_64"
          bash ./scripts/with-android-env.sh sdkmanager --channel=0 \
            "platform-tools" "emulator" "$image"
          echo no | bash ./scripts/with-android-env.sh avdmanager create avd \
            --force --name secpal-smoke-api35 --package "$image"
          # start-android-emulator.sh enforces -wipe-data and -no-snapshot.
          npm run android:emulator:start -- secpal-smoke-api35 5570
          if ! npm run android:device:wait -- "$ANDROID_SERIAL" 300; then
            emulator_log="${TMPDIR:-/tmp}/secpal-android-emulators/secpal-smoke-api35-5570.log"
            cat "$emulator_log" >&2 || true
            exit 1
          fi

      - name: Clean install and launch SecPal
        shell: bash
        run: |
          set -euo pipefail
          echo "clean-install" > "$SMOKE_STEP_FILE"
          adb_command() {
            bash ./scripts/with-android-env.sh adb -s "$ANDROID_SERIAL" "$@"
          }
          adb_command uninstall app.secpal >/dev/null 2>&1 || true
          adb_command install -t android/app/build/outputs/apk/debug/app-debug.apk
          adb_command logcat -c
          adb_command shell am start -W -n app.secpal/.MainActivity
          bash ./scripts/forward-android-webview.sh "$ANDROID_SERIAL" 9223 60
          bash ./scripts/check-android-app-health.sh "$ANDROID_SERIAL"

      - name: Run Android smoke journey
        env:
          SECPAL_TEST_PASSWORD: ${{ secrets.ANDROID_SMOKE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          adb_command() {
            bash ./scripts/with-android-env.sh adb -s "$ANDROID_SERIAL" "$@"
          }
          mark_step() {
            echo "$1" > "$SMOKE_STEP_FILE"
            echo "--- Android smoke step: $1"
          }
          reconnect_webview() {
            bash ./scripts/forward-android-webview.sh "$ANDROID_SERIAL" 9223 60
          }
          assert_healthy() {
            bash ./scripts/check-android-app-health.sh "$ANDROID_SERIAL"
          }
          run_action() {
            mark_step "$1"
            npm run test:live:android-smoke -- "$1"
            assert_healthy
          }
          restart_app() {
            adb_command shell am force-stop app.secpal
            adb_command shell am start -W -n app.secpal/.MainActivity
            reconnect_webview
          }

          run_action network-ready
          run_action initial
          run_action configure

          mark_step runtime-persistence-restart
          restart_app
          run_action login-persisted

          run_action login
          run_action protected-profile

          mark_step background-foreground
          lifecycle_pid="$(adb_command shell pidof app.secpal | tr -d '\r')"
          adb_command shell input keyevent KEYCODE_HOME
          sleep 2
          background_pid="$(adb_command shell pidof app.secpal | tr -d '\r')"
          [[ "$background_pid" == "$lifecycle_pid" ]]
          adb_command shell am start -W -n app.secpal/.MainActivity
          foreground_pid="$(adb_command shell pidof app.secpal | tr -d '\r')"
          [[ "$foreground_pid" == "$lifecycle_pid" ]]
          reconnect_webview
          run_action lifecycle

          run_action logout

          mark_step logout-persistence-restart
          restart_app
          run_action logout-persisted

          run_action switch-instance
          run_action final-configure

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          diagnostics="${RUNNER_TEMP}/android-smoke-diagnostics"
          mkdir -p "$diagnostics"
          android_sha="$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
          frontend_sha="$(git -C frontend rev-parse HEAD 2>/dev/null || echo unavailable)"
          failed_step="$(head -n 1 "$SMOKE_STEP_FILE" 2>/dev/null || echo unknown)"
          adb_command() {
            bash ./scripts/with-android-env.sh adb -s "$ANDROID_SERIAL" "$@"
          }

          adb_command logcat -d 2>/dev/null \
            | node ./scripts/android-smoke.mjs sanitize > "$diagnostics/logcat.txt"
          emulator_log="${TMPDIR:-/tmp}/secpal-android-emulators/secpal-smoke-api35-5570.log"
          if [[ -f "$emulator_log" ]]; then
            node ./scripts/android-smoke.mjs sanitize \
              < "$emulator_log" > "$diagnostics/emulator.log"
          fi
          adb_command exec-out screencap -p > "$diagnostics/screenshot.png" 2>/dev/null || true
          adb_command shell dumpsys activity 2>/dev/null \
            | node ./scripts/android-smoke.mjs sanitize > "$diagnostics/dumpsys-activity.txt"
          adb_command shell dumpsys window 2>/dev/null \
            | node ./scripts/android-smoke.mjs sanitize > "$diagnostics/dumpsys-window.txt"
          adb_command shell dumpsys package app.secpal 2>/dev/null \
            | node ./scripts/android-smoke.mjs sanitize > "$diagnostics/dumpsys-package.txt"
          node ./scripts/android-smoke.mjs inspect > "$diagnostics/webview-state.json" 2>/dev/null || true
          jq -n \
            --arg failed_step "$failed_step" \
            --arg android_sha "$android_sha" \
            --arg frontend_sha "$frontend_sha" \
            --arg emulator "Android API 35 google_apis x86_64" \
            --arg timestamp "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              failed_step: $failed_step,
              android_sha: $android_sha,
              frontend_sha: $frontend_sha,
              emulator: $emulator,
              timestamp: $timestamp
            }' \
            > "$diagnostics/smoke-result.json"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup emulator
        if: always()
        shell: bash
        run: |
          set +e
          bash ./scripts/with-android-env.sh adb -s "$ANDROID_SERIAL" forward --remove tcp:9223
          timeout --foreground --kill-after=5s 30s \
            bash ./scripts/with-android-env.sh adb -s "$ANDROID_SERIAL" emu kill
          emulator_pid_file="${TMPDIR:-/tmp}/secpal-android-emulators/secpal-smoke-api35-5570.pid"
          if [[ -f "$emulator_pid_file" ]]; then
            emulator_pid="$(head -n 1 "$emulator_pid_file")"
            if [[ "$emulator_pid" =~ ^[0-9]+$ ]]; then
              kill "$emulator_pid" 2>/dev/null || true
            fi
          fi

  acceptance:
    name: Android Smoke Acceptance
    if: ${{ always() }}
    needs: [scope, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require applicable native check completion
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RELEVANT: ${{ needs.scope.outputs.relevant }}
          CHILD_RESULT: ${{ needs.smoke.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$RELEVANT:$CHILD_RESULT" in
            true:success | false:skipped) exit 0 ;;
            *) echo 'Applicable native checks did not succeed' >&2; exit 1 ;;
          esac
