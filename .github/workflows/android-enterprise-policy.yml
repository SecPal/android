---
name: Android Enterprise Policy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-enterprise-policy.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/start-android-emulator.sh"
      - "scripts/wait-for-android-device.sh"
      - "scripts/wait-for-device-policy-account-scan.sh"
      - "scripts/with-android-env.sh"
      - "android/build.gradle"
      - "android/settings.gradle"
      - "android/app/build.gradle"
      - "android/app/ct-regression-proguard-rules.pro"
      - "android/app/src/ctRegression/AndroidManifest.xml"
      - "android/app/src/main/AndroidManifest.xml"
      - "android/app/src/androidTest/java/app/secpal/EnterpriseManagementInstrumentedTest.java"
      - "android/dpc/**"
      - "android/management/**"
      - "android/app/src/main/java/app/secpal/EnterprisePolicyState.java"
      - "android/variables.gradle"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-enterprise-policy.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/start-android-emulator.sh"
      - "scripts/wait-for-android-device.sh"
      - "scripts/wait-for-device-policy-account-scan.sh"
      - "scripts/with-android-env.sh"
      - "android/build.gradle"
      - "android/settings.gradle"
      - "android/app/build.gradle"
      - "android/app/ct-regression-proguard-rules.pro"
      - "android/app/src/ctRegression/AndroidManifest.xml"
      - "android/app/src/main/AndroidManifest.xml"
      - "android/app/src/androidTest/java/app/secpal/EnterpriseManagementInstrumentedTest.java"
      - "android/dpc/**"
      - "android/management/**"
      - "android/app/src/main/java/app/secpal/EnterprisePolicyState.java"
      - "android/variables.gradle"

permissions:
  contents: read

jobs:
  device-owner-policy:
    name: DPC ${{ matrix.owner }} policy (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        owner: [device, profile]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies
        run: npm ci

      - name: Verify independent DPC and Work management boundary
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/secpal-enterprise-avd
          SECPAL_ANDROID_EMULATOR_GPU_MODE: software
          SECPAL_ANDROID_EMULATOR_WINDOW_MODE: no-window
        run: |
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          image="system-images;android-35;default;x86_64"
          bash ./scripts/with-android-env.sh sdkmanager --channel=0 \
            "platform-tools" "emulator" "$image"
          echo no | bash ./scripts/with-android-env.sh avdmanager create avd \
            --force --name "secpal-enterprise-api35" --package "$image"
          (
            cd android
            ./gradlew --no-daemon :dpc:prepareDebugSigning :app:validateSigningDebug
          )
          # Test certificates are generated separately; production trust is never substituted.
          export SECPAL_DPC_CERT_SHA256="$(keytool -exportcert -keystore android/.gradle/dpc-debug.keystore \
            -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)"
          export SECPAL_WORK_CERT_SHA256="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)"
          test "$SECPAL_DPC_CERT_SHA256" != "$SECPAL_WORK_CERT_SHA256"
          (
            cd android
            ./gradlew --no-daemon \
              :dpc:assembleCtRegression :dpc:assembleCtRegressionAndroidTest \
              :app:assembleCtRegression :app:assembleCtRegressionAndroidTest
          )
          npm run android:emulator:start -- "secpal-enterprise-api35" 5570
          if ! npm run android:device:wait -- emulator-5570 300; then
            emulator_log="${TMPDIR:-/tmp}/secpal-android-emulators/secpal-enterprise-api35-5570.log"
            cat "$emulator_log" >&2 || true
            exit 1
          fi

          admin_component="io.secpal.dpc.ctregression/app.secpal.SecPalDeviceAdminReceiver"
          cleanup() {
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              shell dpm remove-active-admin --user 0 "$admin_component" || true
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              uninstall io.secpal.dpc.ctregression.test || true
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              uninstall io.secpal.dpc.ctregression || true
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              uninstall app.secpal.ctregression.test || true
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              uninstall app.secpal.ctregression || true
            bash ./scripts/with-android-env.sh adb -s emulator-5570 emu kill || true
          }
          trap cleanup EXIT

          bash ./scripts/with-android-env.sh adb -s emulator-5570 install -t -r \
            android/dpc/build/outputs/apk/ctRegression/dpc-ctRegression.apk
          bash ./scripts/with-android-env.sh adb -s emulator-5570 install -t -r \
            android/app/build/outputs/apk/ctRegression/app-ctRegression.apk
          bash ./scripts/wait-for-device-policy-account-scan.sh emulator-5570 60
          if [[ "${{ matrix.owner }}" == "device" ]]; then
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              shell dpm set-device-owner --user 0 "$admin_component"
          else
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              shell dpm set-profile-owner --user 0 "$admin_component"
          fi
          bash ./scripts/with-android-env.sh adb -s emulator-5570 install -t -r \
            android/dpc/build/outputs/apk/androidTest/ctRegression/dpc-ctRegression-androidTest.apk

          instrumentation_output="$(
            bash ./scripts/with-android-env.sh adb -s emulator-5570 shell am instrument \
              -w -r \
              -e class app.secpal.EnterprisePolicyInstrumentedTest \
              io.secpal.dpc.ctregression.test/androidx.test.runner.AndroidJUnitRunner
          )"
          echo "$instrumentation_output"
          grep -F "OK (1 test)" <<<"$instrumentation_output"
          grep -F "INSTRUMENTATION_CODE: -1" <<<"$instrumentation_output"

          bash ./scripts/with-android-env.sh adb -s emulator-5570 install -t -r \
            android/app/build/outputs/apk/androidTest/ctRegression/app-ctRegression-androidTest.apk
          work_output="$(
            bash ./scripts/with-android-env.sh adb -s emulator-5570 shell am instrument \
              -w -r -e class app.secpal.EnterpriseManagementInstrumentedTest \
              app.secpal.ctregression.test/androidx.test.runner.AndroidJUnitRunner
          )"
          echo "$work_output"
          grep -F "OK (1 test)" <<<"$work_output"
          grep -F "INSTRUMENTATION_CODE: -1" <<<"$work_output"
          # Ordinary callers cannot read the protected state API or request mutation.
          denied_output="$(bash ./scripts/with-android-env.sh adb -s emulator-5570 shell content call \
            --uri content://io.secpal.dpc.ctregression.management --method management_state 2>&1 || true)"
          grep -F "SecurityException" <<<"$denied_output"
