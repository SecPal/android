---
name: Android Enterprise Policy

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-enterprise-policy.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/start-android-emulator.sh"
      - "scripts/wait-for-android-device.sh"
      - "scripts/wait-for-device-policy-account-scan.sh"
      - "scripts/with-android-env.sh"
      - "android/build.gradle"
      - "android/settings.gradle"
      - "android/app/build.gradle"
      - "android/app/ct-regression-proguard-rules.pro"
      - "android/app/src/ctRegression/AndroidManifest.xml"
      - "android/app/src/main/AndroidManifest.xml"
      - "android/app/src/androidTest/java/app/secpal/EnterpriseManagementInstrumentedTest.java"
      - "android/dpc/**"
      - "android/management/**"
      - "android/app/src/main/java/app/secpal/EnterprisePolicyState.java"
      - "android/variables.gradle"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: Classify applicable native checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.result }}
    steps:
      - name: Read complete native PR diff
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEVANT_PATHS: >-
            ["android/**",".github/workflows/android-enterprise-policy.yml","package.json","package-lock.json","scripts/start-android-emulator.sh","scripts/wait-for-android-device.sh","scripts/wait-for-device-policy-account-scan.sh","scripts/with-android-env.sh","android/build.gradle","android/settings.gradle","android/app/build.gradle","android/app/ct-regression-proguard-rules.pro","android/app/src/ctRegression/AndroidManifest.xml","android/app/src/main/AndroidManifest.xml","android/app/src/androidTest/java/app/secpal/EnterpriseManagementInstrumentedTest.java","android/dpc/**","android/management/**","android/app/src/main/java/app/secpal/EnterprisePolicyState.java","android/variables.gradle"]
        with:
          result-encoding: string
          script: |
            if (context.eventName !== 'pull_request') return 'true';
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const read = async () => (await github.rest.pulls.get({ owner, repo, pull_number })).data;
            const before = await read();
            if (before.head.sha !== context.payload.pull_request.head.sha) throw new Error('PR head changed');
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            if (!files.length || files.length >= 3000 || files.length !== before.changed_files ||
                !files.every(file => typeof file.filename === 'string' &&
                  (file.previous_filename === undefined || typeof file.previous_filename === 'string'))) {
              throw new Error('Incomplete native PR diff');
            }
            const after = await read();
            if (after.head.sha !== before.head.sha || after.base.sha !== before.base.sha) throw new Error('PR changed');
            const { matchesGlob } = require('node:path');
            const patterns = JSON.parse(process.env.RELEVANT_PATHS);
            const relevant = path => patterns.some(pattern => pattern.endsWith('/**')
              ? path === pattern.slice(0, -3) || path.startsWith(pattern.slice(0, -2))
              : matchesGlob(path, pattern));
            return files.some(file => relevant(file.filename) ||
              (file.previous_filename && relevant(file.previous_filename))) ? 'true' : 'false';

  device-owner-policy:
    needs: scope
    if: ${{ needs.scope.outputs.relevant == 'true' }}
    name: DPC ${{ matrix.owner }} policy (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        owner: [device, profile]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.11.1"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies
        run: npm ci

      - name: Verify independent DPC and Work management boundary
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/secpal-enterprise-avd
          SECPAL_ANDROID_EMULATOR_GPU_MODE: software
          SECPAL_ANDROID_EMULATOR_WINDOW_MODE: no-window
        run: |
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          image="system-images;android-35;default;x86_64"
          bash ./scripts/with-android-env.sh sdkmanager --channel=0 \
            "platform-tools" "emulator" "$image"
          echo no | bash ./scripts/with-android-env.sh avdmanager create avd \
            --force --name "secpal-enterprise-api35" --package "$image"
          work_signing_report="$RUNNER_TEMP/secpal-work-signing-report.txt"
          (
            cd android
            ./gradlew --no-daemon :dpc:prepareDebugSigning :app:validateSigningDebug \
              :app:signingReport --console=plain
          ) > "$work_signing_report"
          # Test certificates are generated separately; production trust is never substituted.
          SECPAL_DPC_CERT_SHA256="$(keytool -exportcert -keystore android/.gradle/dpc-debug.keystore \
            -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)"
          export SECPAL_DPC_CERT_SHA256
          # Gradle selects the signing store; a conventional HOME path can name a different key.
          SECPAL_WORK_CERT_SHA256="$(awk '
            $0 == "Variant: ctRegression" { selected = 1; next }
            selected && $1 == "SHA-256:" { gsub(":", "", $2); print tolower($2); exit }
          ' "$work_signing_report")"
          export SECPAL_WORK_CERT_SHA256
          [[ "$SECPAL_WORK_CERT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$SECPAL_DPC_CERT_SHA256" != "$SECPAL_WORK_CERT_SHA256"
          (
            cd android
            ./gradlew --no-daemon \
              :dpc:assembleCtRegression :dpc:assembleCtRegressionAndroidTest \
              :app:assembleCtRegression :app:assembleCtRegressionAndroidTest
          )
          npm run android:emulator:start -- "secpal-enterprise-api35" 5570
          if ! npm run android:device:wait -- emulator-5570 300; then
            emulator_log="${TMPDIR:-/tmp}/secpal-android-emulators/secpal-enterprise-api35-5570.log"
            cat "$emulator_log" >&2 || true
            exit 1
          fi

          admin_component="io.secpal.dpc.ctregression/app.secpal.SecPalDeviceAdminReceiver"
          cleanup() {
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              shell dpm remove-active-admin --user 0 "$admin_component" || true
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              uninstall io.secpal.dpc.ctregression.test || true
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              uninstall io.secpal.dpc.ctregression || true
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              uninstall app.secpal.ctregression.test || true
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              uninstall app.secpal.ctregression || true
            bash ./scripts/with-android-env.sh adb -s emulator-5570 emu kill || true
          }
          trap cleanup EXIT

          bash ./scripts/with-android-env.sh adb -s emulator-5570 install -t -r \
            android/dpc/build/outputs/apk/ctRegression/dpc-ctRegression.apk
          bash ./scripts/with-android-env.sh adb -s emulator-5570 install -t -r \
            android/app/build/outputs/apk/ctRegression/app-ctRegression.apk
          bash ./scripts/wait-for-device-policy-account-scan.sh emulator-5570 60
          if [[ "${{ matrix.owner }}" == "device" ]]; then
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              shell dpm set-device-owner --user 0 "$admin_component"
          else
            bash ./scripts/with-android-env.sh adb -s emulator-5570 \
              shell dpm set-profile-owner --user 0 "$admin_component"
          fi
          bash ./scripts/with-android-env.sh adb -s emulator-5570 install -t -r \
            android/dpc/build/outputs/apk/androidTest/ctRegression/dpc-ctRegression-androidTest.apk

          instrumentation_output="$(
            bash ./scripts/with-android-env.sh adb -s emulator-5570 shell am instrument \
              -w -r \
              -e class app.secpal.EnterprisePolicyInstrumentedTest \
              io.secpal.dpc.ctregression.test/androidx.test.runner.AndroidJUnitRunner
          )"
          echo "$instrumentation_output"
          grep -F "OK (1 test)" <<<"$instrumentation_output"
          grep -F "INSTRUMENTATION_CODE: -1" <<<"$instrumentation_output"

          bash ./scripts/with-android-env.sh adb -s emulator-5570 install -t -r \
            android/app/build/outputs/apk/androidTest/ctRegression/app-ctRegression-androidTest.apk
          work_output="$(
            bash ./scripts/with-android-env.sh adb -s emulator-5570 shell am instrument \
              -w -r -e class app.secpal.EnterpriseManagementInstrumentedTest \
              app.secpal.ctregression.test/androidx.test.runner.AndroidJUnitRunner
          )"
          echo "$work_output"
          grep -F "OK (1 test)" <<<"$work_output"
          grep -F "INSTRUMENTATION_CODE: -1" <<<"$work_output"
          # Ordinary callers cannot read the protected state API or request mutation.
          denied_output="$(bash ./scripts/with-android-env.sh adb -s emulator-5570 shell content call \
            --uri content://io.secpal.dpc.ctregression.management --method management_state 2>&1 || true)"
          grep -F "SecurityException" <<<"$denied_output"

  acceptance:
    name: Enterprise Policy Acceptance
    if: ${{ always() }}
    needs: [scope, device-owner-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require applicable native check completion
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RELEVANT: ${{ needs.scope.outputs.relevant }}
          CHILD_RESULT: ${{ needs.device-owner-policy.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$RELEVANT:$CHILD_RESULT" in
            true:success | false:skipped) exit 0 ;;
            *) echo 'Applicable native checks did not succeed' >&2; exit 1 ;;
          esac
