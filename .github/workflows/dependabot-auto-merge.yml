# Dependabot Auto-Merge Workflow (Android Repository)
# Uses the centralized reusable workflow from .github repository
#
# For implementation details, see:
# SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml

---
name: Dependabot Auto-Merge

on:
  # Dependabot pull_request runs receive a read-only token. The target event is
  # safe because this caller only invokes immutable reviewed workflow code and
  # never checks out or executes pull-request-controlled content.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Ensure only one auto-merge runs at a time per PR
concurrency:
  group: ${{ github.repository }}-dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Required permissions for dependabot auto-merge
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@18befca1fe8712374b93331bf235a28912937e85 # main
    with:
      phase: "1" # Phase 1: Only PATCH updates auto-merge
      merge-method: "squash" # Use squash merge for cleaner history
