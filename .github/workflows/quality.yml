---
name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  reuse:
    name: Check REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@480e66d1c9f287f9fbaa25a219c2cab8cadb6a83 # main

  license-compatibility:
    name: Check License Compatibility
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-license-compatibility.yml@fa88c750f53091e08d051df9c60a2a3c06d5ec03 # main

  prettier:
    name: Formatting Check
    uses: SecPal/.github/.github/workflows/reusable-prettier.yml@fa88c750f53091e08d051df9c60a2a3c06d5ec03 # main

  markdown-lint:
    name: Markdown Lint
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@480e66d1c9f287f9fbaa25a219c2cab8cadb6a83 # main

  ai-instructions:
    name: AI Instructions
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@480e66d1c9f287f9fbaa25a219c2cab8cadb6a83 # main

  eslint:
    name: ESLint
    uses: SecPal/.github/.github/workflows/reusable-node-lint.yml@fa88c750f53091e08d051df9c60a2a3c06d5ec03 # main
    with:
      node-version: "22"

  typecheck:
    name: TypeScript Check
    uses: SecPal/.github/.github/workflows/reusable-node-build.yml@afb8cdde9ed711a5792171815ab284cf440af477 # main
    with:
      node-version: "22"
      build-command: "npm run typecheck"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Audit dependencies
        run: npm audit --audit-level=high

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies
        run: npm ci

      - name: Run Android lint
        id: android_lint
        run: npm run native:lint

      - name: Upload Android lint reports
        if: ${{ failure() && steps.android_lint.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results-*
          if-no-files-found: error
          retention-days: 7

  android-network-security:
    name: Android Release Network Security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies
        run: npm ci

      - name: Verify effective Android release network policy
        run: npm run native:verify:network-security

      - name: Verify Android packaging frontend guard
        run: npm run native:verify:packaging-guard

  vitest:
    name: Vitest Tests
    needs: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !startsWith(github.head_ref, 'spike/') && !startsWith(github.ref, 'refs/heads/spike/') }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/lcov.info,./coverage/clover.xml
          flags: android
          name: android-coverage
          fail_ci_if_error: ${{ !contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.actor) }}
        # Allow step to succeed even if upload fails for dependabot
        # This prevents blocking the PR when CODECOV_TOKEN is unavailable
        continue-on-error: ${{ contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.actor) }}

      - name: Skip Codecov upload when token is unavailable
        if: ${{ env.CODECOV_TOKEN == '' }}
        run: echo "Skipping Codecov upload because CODECOV_TOKEN is not configured for this repository."
