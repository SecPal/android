---
name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-security:
    name: Repository Security
    uses: ./.github/workflows/reusable-repository-security.yml
    permissions:
      contents: read

  reuse:
    name: Check REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main

  license-compatibility:
    name: Check License Compatibility
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-license-compatibility.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main

  prettier:
    name: Formatting Check
    uses: SecPal/.github/.github/workflows/reusable-prettier.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main
    with:
      node-version: "26.11.1"

  markdown-lint:
    name: Markdown Lint
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main
    with:
      node-version: "26.11.1"

  ai-instructions:
    name: AI Instructions
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main
    with:
      node-version: "26.11.1"

  eslint:
    name: ESLint
    uses: SecPal/.github/.github/workflows/reusable-node-lint.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main
    with:
      node-version: "26.11.1"

  typecheck:
    name: TypeScript Check
    uses: SecPal/.github/.github/workflows/reusable-node-build.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main
    with:
      node-version: "26.11.1"
      build-command: "npm run typecheck"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.11.1"
          cache: "npm"

      - name: Audit dependencies
        run: npm audit --audit-level=high

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.11.1"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies
        run: npm ci

      - name: Run Android lint
        id: android_lint
        run: npm run native:lint

      - name: Upload Android lint reports
        if: ${{ failure() && steps.android_lint.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-lint-reports
          path: |
            android/app/build/reports/lint-results-*
            android/dpc/build/reports/lint-results-*
          if-no-files-found: error
          retention-days: 7

  android-jvm-unit-tests:
    name: Android JVM Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.11.1"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies
        run: npm ci

      - name: Run Android JVM unit tests
        id: android_jvm_unit_tests
        run: npm run native:test:unit

      - name: Upload Android JVM unit test reports
        if: ${{ failure() && steps.android_jvm_unit_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-jvm-unit-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest
            android/dpc/build/reports/tests/testDebugUnitTest
            android/dpc/build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 7

  android-network-security:
    name: Android Release Network Security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.11.1"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies
        run: npm ci

      - name: Verify effective Android release network policy
        run: npm run native:verify:network-security

      - name: Verify Android packaging frontend guard
        run: npm run native:verify:packaging-guard

  vitest:
    name: Vitest Tests
    needs: [dependency-audit, repository-security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SECPAL_REQUIRE_CSP_BROWSER: "1"

    steps:
      - name: Require successful security prerequisites
        env:
          SECURITY_RESULT: ${{ needs.repository-security.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          if [ "$SECURITY_RESULT" != "success" ] || [ "$AUDIT_RESULT" != "success" ]; then
            echo "Required repository security or dependency audit did not succeed." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.11.1"
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/lcov.info,./coverage/clover.xml
          flags: android
          name: android-coverage
          fail_ci_if_error: ${{ !contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.actor) }}
        # Allow step to succeed even if upload fails for dependabot
        # This prevents blocking the PR when CODECOV_TOKEN is unavailable
        continue-on-error: ${{ contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.actor) }}

      - name: Skip Codecov upload when token is unavailable
        if: ${{ env.CODECOV_TOKEN == '' }}
        run: echo "Skipping Codecov upload because CODECOV_TOKEN is not configured for this repository."
