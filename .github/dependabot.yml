# Dependabot configuration for SecPal Android (Capacitor wrapper + native Android)
# Automatically creates PRs for ALL dependency updates (including Major versions)
# Security updates are prioritized and checked daily in early morning hours
---
version: 2
updates:
  # npm - JavaScript/TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
      - "dependabot"
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"

  # GitHub Actions - Workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"
    groups:
      # SecPal reusable workflows track immutable commits on main rather than
      # releases, so Dependabot cannot assign them a semantic update type.
      shared-workflow-pins:
        patterns:
          - "SecPal/.github/.github/workflows/*"
      # Keep versioned action groups semver-homogeneous so their PR titles and
      # the reusable auto-merge policy preserve the actual update class.
      github-actions-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "SecPal/.github/.github/workflows/*"
        update-types:
          - "patch"
      github-actions-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "SecPal/.github/.github/workflows/*"
        update-types:
          - "minor"
      github-actions-major:
        patterns:
          - "*"
        exclude-patterns:
          - "SecPal/.github/.github/workflows/*"
        update-types:
          - "major"

  # Gradle - Native Android dependencies across active build roots
  - package-ecosystem: "gradle"
    directories:
      - "/android"
      - "/android/app"
      - "/android/capacitor-cordova-android-plugins"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
      - "dependabot"
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"

  # Bundler - Fastlane and release tooling dependencies
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "bundler"
      - "dependabot"
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"

  # pre-commit - Repository hook dependencies
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "pre-commit"
      - "dependabot"
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"
