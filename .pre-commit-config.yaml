# Pre-commit hooks for quality checks
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

---
repos:
  # REUSE compliance
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.1.2
    hooks:
      - id: reuse

  # Code formatting
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: ./scripts/run-lockfile-tool.sh prettier --write
        language: system
        # Keep this scope aligned with package.json's format:check script.
        # The javascript tag covers both .js and .mjs; files prevents it from
        # also matching .cjs. TypeScript JSX, JavaScript JSX, Sass, and XML
        # are intentionally outside the repository's current Prettier scope.
        types_or: [markdown, yaml, json, ts, javascript, css, html]
        files: \.(?:md|yml|yaml|json|ts|js|mjs|css|html)$
        exclude: 'package-lock\.json|composer\.lock|yarn\.lock|pnpm-lock\.yaml'

  # Markdown linting
  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: >-
          ./scripts/run-lockfile-tool.sh markdownlint --config
          .markdownlint.json --ignore node_modules --ignore fastlane/README.md
        language: system
        types: [markdown]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yml"]

  # GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Git hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
